# headmusic configuration defaults.
#
# Every value here is a PROVISIONAL ENGINEERING DEFAULT. None of them is a validated hardware
# limit or an ergonomic/biomechanical threshold. Each value is copied into session.json for
# every recording. Precise definitions: docs/quality-and-metrics.md
config_version = 1

[imu]
mode = "pose"                  # "pose" (primary, protocol §2.1) | "raw" (separate characterisation session)
frequency_requested_hz = 240   # used only if supported in the selected mode, else the highest supported
                               # rate below it (logged as a fallback); never silently above the request

[neutral]
window_s = 3.0                 # capture window (device clock), initial engineering value
tau_stab_deg = 2.0             # PLACEHOLDER max dispersion for acceptance; to be set from bench data (open item O6).
                               # Not a statement about human stillness.

[flags]
gap_reference = "measured"     # "measured": m = 1e9 / r_ref (fixture-measured rate) | "adaptive": running quantile
k_gap = 1.5                    # gap if interval > k_gap * m + ts_resolution_ns
ts_resolution_ns = 1000000     # device timestamp resolution, measured 2026-11-10 (1 ms)
ref_quantile = 0.25            # adaptive fallback: quantile of recent valid intervals
n_ref = 200                    # adaptive fallback: window length (intervals)
n_min = 20                     # adaptive fallback: warm-up; before that m = 1e9 / f_selected
tau_jump_deg = 20.0            # sensor-glitch detector between consecutive samples; NOT a head-motion limit
tau_norm = 1e-3                # |‖q‖ − 1| above this sets norm_deviation (informational)
eps_zero = 1e-6                # ‖q‖ below this sets zero_norm (invalidating)
euler_singular_deg = 89.0      # |display pitch| above this sets euler_near_singular (numeric guard)

# Fixture-measured achieved rates (Hz) for the VITURE Pro (PID 0x101D), keyed by selected frequency: the
# achieved device-clock rate over the longest gap-free stretch of an approved stationary fixture run
# (docs/bench-checklist.md, "Deriving r_ref"). Frequencies without an entry use the adaptive reference.
# 240: 202.483 from G0 run R2, session 710efe0c (2026-11-11 UTC), stretch 600.2 s, re-checked with this
#      value (0 gaps). The earlier preliminary value was 202.5 (probe of unknown placement).
# 60:  59.435 from G0 run R3, session 0fd7c040 (2026-11-11 UTC), stretch 300.2 s, re-checked (0 gaps).
# 90:  84.613 from G0 run R4, session 98addf22 (2026-11-11 UTC), stretch 300.2 s, re-checked (0 gaps).
# 120: 112.342 from G0 run R5, session bcf348a3 (2026-11-11 UTC), stretch 300.2 s, re-checked (0 gaps).
[flags.r_ref_hz.pose]
"60" = 59.435
"90" = 84.613
"120" = 112.342
"240" = 202.483

[flags.r_ref_hz.raw]

[gate]
t_stale_ms = 100               # stale if the last valid sample was produced longer ago than this (host clock)
offset_drift_ppm = 200.0       # how fast the clock-offset baseline may rise (G0 measured 12-17 ppm skew); provisional

[metrics]
w_ref_s = 5.0                  # stationary reference window (first W_ref seconds)
w_jitter_s = 1.0               # centred moving-average width used to detrend angular jitter
segment_window_s = 1.0         # bench segments: start/end orientation = mean of the first/last window

[io]
flush_interval_s = 1.0         # files are flushed at least this often (max data lost on a crash)

[acquisition]
drain_interval_ms = 5          # how often the drain thread empties the native ring buffer
reconnect_poll_s = 1.0         # USB re-enumeration period (disconnect detection and reconnect)
auto_reconnect = true
sdk_log_level = 1              # 0 none, 1 error, 2 info, 3 debug

# ---------------------------------------------------------------------------------------------- Phase 2
# Instrument (gesture FSM). docs/phase2-proposal.md §3. EVERY value below is a PROVISIONAL ENGINEERING
# DEFAULT for bench use, to be set by the research team (docs/research/phase2-open-questions.md). None is a
# validated ergonomic, comfort or safety limit. Angles are yaw_rel: the heading of the glasses' forward axis
# relative to the neutral reference (+ = turn left), equal to the documented display yaw.
[instrument]
start_enabled = true
neutral_yaw_deg = 5.0          # neutral zone |yaw_rel| <= this: rest / silence (latch) and where the neutral
                               # is calibrated. Keys may start at its edge. (2A layout: 4.0)
hysteresis_deg = 1.5           # enter a zone inside its interval, stay while within the interval ± this
dwell_ms = 80.0                # short settle time (MVP interaction refinement, docs/mvp-iteration-2.md §8):
                               # a key sounds once the cursor has stayed within dwell_stability_deg for this
                               # long; keys crossed faster than ~stability/dwell (25°/s) stay silent, and the
                               # active chord keeps sounding meanwhile. 0 = immediate keys (sound on entry).
                               # The protocol §6 candidate is 400–600 ms (via_neutral.toml, confirm.toml: 500)
cooldown_ms = 0.0              # no new chord within this time after a commit; 0 = off (MVP iteration 2;
                               # the protocol machine profile uses 300)
rearm_hold_ms = 0.0            # time in the neutral zone needed to re-arm after a commit or reset
max_elevation_deg = 89.0       # numeric guard: forward axis must be within this of the neutral horizontal plane
reset_on_gap_before = true     # any flagged sample gap resets the gesture, even below the gate's T_stale
duplicate_timestamp = "reset"  # "reset": a duplicate device timestamp resets the gesture (strict) |
                               # "skip": such a sample is ignored without a reset (research Q12; R2D-1 finding)
# MVP iteration 2 (docs/mvp-iteration-2.md; an MVP iteration, not a protocol change; research Q17)
transitions = "direct"         # "direct": switch chords without returning to neutral | "via_neutral": protocol §6
playback = "latch"             # "latch": sounds until another commit, a release or an interruption |
                               # "hold": sounds only while the head stays in the chord's region
dwell_stability_deg = 2.0      # the dwell restarts if yaw_rel moves more than this from where it started
                               # (a crossing never settles, a stop does); 0 = off
neutral_rest_release_ms = 0.0  # latch: 0 = the neutral zone never silences the chord (it sounds until another
                               # chord is confirmed, R, Esc or a safety interruption). > 0 = resting in neutral
                               # this long releases it (iteration 2 used 150; it cut slow crossings of neutral)

# Contiguous keys (MVP iteration 2: "no gap between the keys"): each key starts where the previous one ends, so
# moving from one to the next switches directly; hysteresis decides at each shared edge. Provisional layout for
# bench use, NOT an ergonomic layout. The 2A layout with gaps is in config/profiles/layout_2a_gaps.toml.
[[instrument.yaw_regions]]
chord = "C"
yaw_min_deg = 18.0
yaw_max_deg = 40.0

[[instrument.yaw_regions]]
chord = "G"
yaw_min_deg = 5.0
yaw_max_deg = 18.0

[[instrument.yaw_regions]]
chord = "Am"
yaw_min_deg = -18.0
yaw_max_deg = -5.0

[[instrument.yaw_regions]]
chord = "F"
yaw_min_deg = -40.0
yaw_max_deg = -18.0

# Music engine (Phase 2B). docs/phase2-proposal.md §5. PROVISIONAL ENGINEERING DEFAULTS.
[music]
backend = "winmm"              # "winmm": Windows MIDI out (built-in, no dependency) | "null": no sound (tests, replay)
midi_device = 0                # winmm output device index, or a name substring ("headmusic midi-devices" lists them)
channel = 1                    # MIDI channel for chords (1..16)
velocity = 100
release_on_interruption = true # an interruption (any gesture reset) silences the sounding chord (research Q8)
allow_same_chord_recommit = true  # re-committing the sounding chord re-triggers it (research Q10)
program = 16                   # General MIDI program (0-based) sent at start: 16 Drawbar Organ sustains while
                               # held and starts at once. 0 Piano decays by itself (the R2D-1 "no sustain");
                               # 19 Church Organ, 48 Strings, 89 Warm Pad (slower attack). MVP iteration 2

[music.chords]                 # MIDI note numbers (60 = C4)
C = [60, 64, 67]               # C4 E4 G4
G = [55, 59, 62]               # G3 B3 D4
Am = [57, 60, 64]              # A3 C4 E4
F = [53, 57, 60]               # F3 A3 C4

[music.accompaniment]          # fixed-tempo click; off by default
enabled = false
auto_start = true              # start at the first return to neutral (beat 0 = that sample's production time)
bpm = 80.0                     # protocol §7 candidate tempo
beats_per_bar = 4
channel = 10                   # General MIDI percussion
note = 76                      # Hi Wood Block
accent_note = 77               # Low Wood Block, first beat of each bar
velocity = 90
duration_ms = 50.0
on_interruption = "continue"   # "continue" (time reference keeps running) | "mute" (research Q9)
quantize = false               # true: chord onsets move to the next beat; the raw commit time is still logged
